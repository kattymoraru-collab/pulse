<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Scorebord — FabLab-quiz</title>
<link rel="stylesheet" href="shared.css">
<style>
  body { background: var(--ink); color: var(--paper-warm); }

  main { max-width: 44rem; }

  .masthead { border-color: var(--green); }
  .eyebrow { color: var(--board); }
  h1 { color: #fff; }

  ol.board { list-style: none; margin: 1.5rem 0 0; padding: 0; display: grid; gap: 0.5rem; }

  ol.board li {
    display: grid; grid-template-columns: 3rem 1fr auto; align-items: center; gap: 0.9rem;
    padding: 0.7rem 1rem; border-radius: var(--radius);
    background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.12);
    font-family: var(--mono); font-size: clamp(1rem, 3vw, 1.4rem);
  }

  ol.board li:first-child { border-color: var(--green); background: rgba(5, 166, 133, 0.16); }

  .rank {
    display: flex; align-items: center; justify-content: center;
    width: 2.4rem; height: 2.4rem; border-radius: 50%;
    border: 2px solid var(--board-edge); background: var(--board); color: var(--ink);
    font-weight: 700; font-size: 1rem;
  }

  li:first-child .rank { background: var(--green); border-color: var(--green); color: #fff; }

  .alias { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: 0.04em; }
  .points { font-weight: 700; }
  .points small { color: var(--board); font-weight: 400; }

  .empty { color: var(--board); margin: 2rem 0; font-size: 1.1rem; }
  .updated { color: rgba(255, 255, 255, 0.5); font-size: 0.8rem; margin-top: 1.5rem; }
</style>
</head>
<body>
<main>
  <header class="masthead">
    <p class="eyebrow"><span data-copy="event">Open Campus Dag, FabLab</span>
      <button class="lang" type="button" id="lang">EN</button></p>
    <h1 data-copy="title">Scorebord</h1>
  </header>

  <p class="empty" id="empty" data-copy="empty">Nog geen scores. Scan de code en speel mee!</p>
  <ol class="board" id="board"></ol>
  <p class="updated" id="updated"></p>
</main>

<script src="shared.js"></script>
<script>
  const COPY = {
    nl: {
      event: "Open Campus Dag, FabLab", title: "Scorebord",
      empty: "Nog geen scores. Scan de code en speel mee!",
      updated: "Vernieuwt elke 15 seconden",
    },
    en: {
      event: "Open Campus Day, FabLab", title: "Scoreboard",
      empty: "No scores yet. Scan the code and play!",
      updated: "Refreshes every 15 seconds",
    },
  };

  const board = document.getElementById("board");
  const empty = document.getElementById("empty");

  async function refresh() {
    try {
      const response = await fetch(`${PULSE.ENDPOINT}?view=leaderboard`);
      const data = await response.json();
      const scores = (data.scores || [])
        .map((entry) => ({ ...entry, points: PULSE.quizPoints(entry.score, entry.durationSec) }))
        .sort((a, b) => b.points - a.points || a.durationSec - b.durationSec);
      empty.hidden = scores.length > 0;
      board.innerHTML = scores
        .map((entry, i) => `
          <li>
            <span class="rank">${i + 1}</span>
            <span class="alias">${escapeHtml(entry.alias)}</span>
            <span class="points">${entry.points}<small> · ${entry.score}/${entry.total} · ${entry.durationSec}s</small></span>
          </li>`)
        .join("");
      document.getElementById("updated").textContent = COPY[PULSE.language].updated;
    } catch {
      /* keep the last known board on a failed poll */
    }
  }

  function escapeHtml(text) {
    const div = document.createElement("div");
    div.textContent = String(text);
    return div.innerHTML;
  }

  document.getElementById("lang").addEventListener("click", () => {
    PULSE.toggleLanguage();
    PULSE.applyCopy(COPY);
    refresh();
  });

  PULSE.nav("board");
  PULSE.applyCopy(COPY);
  refresh();
  setInterval(refresh, 15000);
</script>
</body>
</html>
